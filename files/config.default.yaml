# ═══════════════════════════════════════════
# 🦕 DinoClash Default Config for OpenWrt
# TUN Mode - Works like FLClash
# All Software Compatible
# Developer: Jahid Hasan Shuvo
# ═══════════════════════════════════════════
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
external-controller: 0.0.0.0:9595
external-ui: /etc/mihomo/ui
secret: "flclash123"
geodata-mode: true
geodata-loader: standard
geo-auto-update: false
find-process-mode: "off"
global-client-fingerprint: chrome
tcp-concurrent: true
unified-delay: true
keep-alive-interval: 15
keep-alive-idle: 600

profile:
  store-selected: true
  store-fake-ip: true
  tracing: false

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ═══ TUN MODE - Works like FLClash ═══
tun:
  enable: true
  stack: system
  device: utun
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  mtu: 1500
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  inet4-address:
    - 172.19.0.1/30

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.linkedin.com"
    - "+.discord.com"
    - "+.discordapp.com"
    - "+.whatsapp.net"
    - "+.messenger.com"
    - "+.bkash.com"
    - "+.nagad.com.bd"
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 223.5.5.5
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback:
    - tls://1.1.1.1:853
    - tls://dns.google:853
  nameserver-policy:
    '+.linkedin.com': '1.1.1.1'
    '+.discord.com': '1.1.1.1'
    '+.discordapp.com': '1.1.1.1'
    '+.whatsapp.com': '1.1.1.1'
    '+.whatsapp.net': '1.1.1.1'
    '+.messenger.com': '1.1.1.1'
    '+.facebook.com': '1.1.1.1'
    '+.instagram.com': '1.1.1.1'
    '+.telegram.org': '1.1.1.1'

proxies: []

proxy-groups:
  - name: "Proxy"
    type: select
    proxies:
      - Auto
      - DIRECT

  - name: "Auto"
    type: url-test
    proxies:
      - DIRECT
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

rules:
  # ═══ Chat & Social Apps (DIRECT) ═══
  - 'DOMAIN-SUFFIX,linkedin.com,DIRECT'
  - 'DOMAIN-SUFFIX,licdn.com,DIRECT'
  - 'DOMAIN-KEYWORD,linkedin,DIRECT'
  - 'DOMAIN-SUFFIX,discord.com,DIRECT'
  - 'DOMAIN-SUFFIX,discord.gg,DIRECT'
  - 'DOMAIN-SUFFIX,discordapp.com,DIRECT'
  - 'DOMAIN-SUFFIX,discordapp.net,DIRECT'
  - 'DOMAIN-KEYWORD,discord,DIRECT'
  - 'DOMAIN-SUFFIX,whatsapp.com,DIRECT'
  - 'DOMAIN-SUFFIX,whatsapp.net,DIRECT'
  - 'DOMAIN-KEYWORD,whatsapp,DIRECT'
  - 'DOMAIN-SUFFIX,messenger.com,DIRECT'
  - 'DOMAIN-KEYWORD,messenger,DIRECT'
  - 'DOMAIN-SUFFIX,fbcdn.net,DIRECT'
  - 'DOMAIN-SUFFIX,telegram.org,DIRECT'
  - 'DOMAIN-SUFFIX,t.me,DIRECT'
  - 'DOMAIN-KEYWORD,telegram,DIRECT'
  - 'DOMAIN-SUFFIX,slack.com,DIRECT'
  - 'DOMAIN-SUFFIX,zoom.us,DIRECT'
  - 'DOMAIN-SUFFIX,skype.com,DIRECT'
  - 'DOMAIN-SUFFIX,teams.microsoft.com,DIRECT'

  # ═══ Remote Desktop (DIRECT) ═══
  - 'DOMAIN-SUFFIX,ultraviewer.net,DIRECT'
  - 'DOMAIN-KEYWORD,ultraviewer,DIRECT'
  - 'DOMAIN-SUFFIX,anydesk.com,DIRECT'
  - 'DOMAIN-KEYWORD,anydesk,DIRECT'
  - 'DOMAIN-SUFFIX,teamviewer.com,DIRECT'
  - 'DOMAIN-KEYWORD,teamviewer,DIRECT'
  - 'DOMAIN-SUFFIX,rustdesk.com,DIRECT'
  - 'DOMAIN-KEYWORD,rustdesk,DIRECT'

  # ═══ Gaming (DIRECT) ═══
  - 'DOMAIN-KEYWORD,pubg,DIRECT'
  - 'DOMAIN-KEYWORD,freefire,DIRECT'
  - 'DOMAIN-KEYWORD,garena,DIRECT'
  - 'DOMAIN-SUFFIX,epicgames.com,DIRECT'
  - 'DOMAIN-SUFFIX,steampowered.com,DIRECT'
  - 'DOMAIN-SUFFIX,steamcommunity.com,DIRECT'
  - 'DOMAIN-SUFFIX,riotgames.com,DIRECT'
  - 'DOMAIN-SUFFIX,battle.net,DIRECT'
  - 'DOMAIN-KEYWORD,valorant,DIRECT'
  - 'DOMAIN-KEYWORD,fortnite,DIRECT'

  # ═══ Bangladesh Apps (DIRECT) ═══
  - 'DOMAIN-KEYWORD,bkash,DIRECT'
  - 'DOMAIN-KEYWORD,nagad,DIRECT'
  - 'DOMAIN-KEYWORD,rocket,DIRECT'
  - 'DOMAIN-SUFFIX,gp.com.bd,DIRECT'
  - 'DOMAIN-SUFFIX,robi.com.bd,DIRECT'
  - 'DOMAIN-SUFFIX,banglalink.com.bd,DIRECT'
  - 'DOMAIN-SUFFIX,teletalk.com.bd,DIRECT'
  - 'DOMAIN-SUFFIX,daraz.com.bd,DIRECT'
  - 'DOMAIN-SUFFIX,pathao.com,DIRECT'
  - 'DOMAIN-SUFFIX,foodpanda.com.bd,DIRECT'
  - 'DOMAIN-SUFFIX,com.bd,DIRECT'

  # ═══ Banking Apps (DIRECT) ═══
  - 'DOMAIN-KEYWORD,bank,DIRECT'
  - 'DOMAIN-KEYWORD,dbbl,DIRECT'
  - 'DOMAIN-KEYWORD,brac,DIRECT'
  - 'DOMAIN-KEYWORD,islami,DIRECT'
  - 'DOMAIN-KEYWORD,citybank,DIRECT'

  # ═══ LAN Safety (DIRECT) ═══
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,100.64.0.0/10,DIRECT,no-resolve'
  - 'IP-CIDR,224.0.0.0/4,DIRECT,no-resolve'
  - 'DOMAIN-SUFFIX,local,DIRECT'
  - 'DOMAIN-SUFFIX,lan,DIRECT'
  - 'DST-PORT,9595,DIRECT'

  # ═══ Everything Else → Proxy ═══
  - 'MATCH,Proxy'
