# ═══════════════════════════════════════════
# 🦕 DinoClash Default Config for OpenWrt
# Ultra Speed + Low Latency
# Developer: Jahid Hasan Shuvo
# ═══════════════════════════════════════════
mixed-port: 7890
redir-port: 7892
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 0.0.0.0:9595
external-ui: /etc/mihomo/ui
secret: "flclash123"
geodata-mode: true
geodata-loader: standard
geo-auto-update: false
find-process-mode: "off"
global-client-fingerprint: chrome
tcp-concurrent: true
unified-delay: true
keep-alive-interval: 10
keep-alive-idle: 10

profile:
  store-selected: true
  store-fake-ip: true
  tracing: false

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

tun:
  enable: false
  stack: system
  device: utun
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  mtu: 1500
  dns-hijack:
    - "any:53"
  inet4-address:
    - 172.19.0.1/30

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
    - 8.8.8.8
    - 114.114.114.114
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback:
    - tls://1.1.1.1:853
    - tls://dns.google:853
  nameserver-policy:
    '+.google.com': 'https://dns.google/dns-query'
    '+.facebook.com': 'https://1.1.1.1/dns-query'
    '+.youtube.com': 'https://dns.google/dns-query'

proxies: []

proxy-groups:
  - name: "Proxy"
    type: url-test
    proxies:
      - DIRECT
    url: http://www.gstatic.com/generate_204
    interval: 120
    tolerance: 20
    lazy: true

rules:
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,100.64.0.0/10,DIRECT,no-resolve'
  - 'IP-CIDR,224.0.0.0/4,DIRECT,no-resolve'
  - 'DOMAIN-SUFFIX,local,DIRECT'
  - 'DOMAIN-SUFFIX,lan,DIRECT'
  - 'DST-PORT,9595,DIRECT'
  - 'MATCH,Proxy'
