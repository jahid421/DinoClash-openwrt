table inet mihomo {
    set localnetwork {
        type ipv4_addr
        flags interval
        elements = {
            0.0.0.0/8,
            10.0.0.0/8,
            100.64.0.0/10,
            127.0.0.0/8,
            169.254.0.0/16,
            172.16.0.0/12,
            192.0.0.0/24,
            192.168.0.0/16,
            198.18.0.0/15,
            224.0.0.0/4,
            240.0.0.0/4
        }
    }

    set bypass_mac {
        type ether_addr
        flags dynamic,timeout
        timeout 24h
        comment "DinoClash MAC bypass list"
    }

    set bypass_ip {
        type ipv4_addr
        flags interval,timeout
        timeout 24h
        comment "DinoClash IP bypass list"
    }

    chain prerouting {
        type nat hook prerouting priority dstnat - 1; policy accept;

        # Only process LAN traffic
        iifname != "br-lan" return

        # Skip marked traffic
        meta mark 0xff return

        # Skip local networks
        ip daddr @localnetwork return

        # Skip bypass MAC (auto-detect by MAC)
        ether saddr @bypass_mac return

        # Skip bypass IP (static/manual)
        ip saddr @bypass_ip return

        # DNS redirect
        udp dport 53 redirect to :1053
        tcp dport 53 redirect to :1053

        # QUIC/UDP redirect
        udp dport { 443, 8443 } redirect to :7892

        # TCP redirect
        meta l4proto tcp redirect to :7892
    }
}
