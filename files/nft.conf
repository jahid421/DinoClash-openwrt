table inet mihomo {
    set bypass {
        type ipv4_addr
        flags interval
        elements = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/4, 240.0.0.0/4 }
    }
    chain dns {
        type nat hook prerouting priority dstnat; policy accept;
        meta mark 0xff return
        ip daddr @bypass return
        udp dport 53 redirect to :1053
        tcp dport 53 redirect to :1053
    }
    chain prerouting {
        type filter hook prerouting priority mangle; policy accept;
        meta mark 0xff return
        ip daddr @bypass return
        meta l4proto { tcp, udp } tproxy to :7893 meta mark set 0x01
    }
    chain output {
        type route hook output priority mangle; policy accept;
        meta mark 0xff return
        ip daddr @bypass return
        meta l4proto { tcp, udp } meta mark set 0x01
    }
}
